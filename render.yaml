services:
  - type: web
    name: sift-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    dockerCommand: sh -c 'node --import tsx backend/scripts/migrate.ts && exec node --import tsx backend/src/server.ts'
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: supabase
      - key: DEPLOYMENT_MODE
        value: demo
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: MAX_REPO_BYTES
        value: "26214400"
      - key: MAX_FILES
        value: "300"
      - key: MAX_COMMITS
        value: "1500"
      - key: MAX_REPO_MS
        value: "300000"
      - key: JUDGE_MAX_EVIDENCE_CHARS
        value: "8000"
      - key: JUDGE_MAX_OUTPUT_TOKENS
        value: "2048"
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: DECISION_PROVIDER
        value: none
      - key: STORAGE_BUCKET
        value: sift-private
      - key: RANKINGS_ENABLED
        value: "false"
      - key: DATASET_LICENSE_APPROVED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_BASE64
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sift-queue
          property: connectionString
  - type: keyvalue
    name: sift-queue
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []
